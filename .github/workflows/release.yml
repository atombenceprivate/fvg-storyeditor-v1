name: Kiadás

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    uses: ./.github/workflows/windows-package.yml

  debian-build:
    uses: ./.github/workflows/debian-package.yml

  release:
    needs: [windows-build, debian-build]
    runs-on: ubuntu-latest
    steps:
      - name: Forráskód kiolvasása
        uses: actions/checkout@v4

      - name: Windows csomag letöltése
        uses: actions/download-artifact@v4
        with:
          name: windows-csomagok
          path: dist

      - name: Debian-csomag letöltése
        uses: actions/download-artifact@v4
        with:
          name: debian-csomag
          path: dist

      - name: GitHub kiadás létrehozása
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.exe
