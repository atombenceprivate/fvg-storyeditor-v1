name: Kiadás

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Forráskód kiolvasása
        uses: actions/checkout@v4
      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows alkalmazás felépítése
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconsole --onefile --name FVGStoryEditor app.py
      - name: NSIS telepítő felépítése
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer\fvg-story-editor.nsi
      - name: Windows alkalmazás mentése
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

  release:
    needs: windows-build
    runs-on: ubuntu-latest
    steps:
      - name: Forráskód kiolvasása
        uses: actions/checkout@v4

      - name: Debian-csomag felépítése
        run: bash build_deb.sh

      - name: Windows alkalmazás letöltése
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist

      - name: GitHub kiadás létrehozása
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.exe
