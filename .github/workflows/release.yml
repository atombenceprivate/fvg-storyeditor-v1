name: Kiadás

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Forráskód kiolvasása
        uses: actions/checkout@v4
      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows alkalmazás felépítése
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconsole --onefile --name FVGStoryEditor app.py
      - name: NSIS telepítő felépítése
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          & $nsis installer\fvg-story-editor.nsi
      - name: Windows csomagok mentése
        uses: actions/upload-artifact@v4
        with:
          name: windows-csomagok
          path: dist/*.exe
          if-no-files-found: error

  debian-build:
    runs-on: ubuntu-latest
    steps:
      - name: Forráskód kiolvasása
        uses: actions/checkout@v4
      - name: Debian-csomag felépítése
        run: bash build_deb.sh
      - name: Debian-csomag mentése
        uses: actions/upload-artifact@v4
        with:
          name: debian-csomag
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: [windows-build, debian-build]
    runs-on: ubuntu-latest
    steps:
      - name: Forráskód kiolvasása
        uses: actions/checkout@v4

      - name: Windows csomag letöltése
        uses: actions/download-artifact@v4
        with:
          name: windows-csomagok
          path: dist

      - name: Debian-csomag letöltése
        uses: actions/download-artifact@v4
        with:
          name: debian-csomag
          path: dist

      - name: GitHub kiadás létrehozása
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.exe
