name: Kiadás

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Forráskód kiolvasása
        uses: actions/checkout@v4

      - name: Debian-csomag felépítése
        run: bash build_deb.sh

      - name: GitHub kiadás létrehozása
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.deb
