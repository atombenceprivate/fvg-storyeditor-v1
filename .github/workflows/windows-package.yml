name: Windows csomag

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Forráskód kiolvasása
        uses: actions/checkout@v4
      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows alkalmazás felépítése
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconsole --onefile --name FVGStoryEditor app.py
      - name: NSIS telepítő felépítése
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer\fvg-story-editor.nsi
      - name: Windows csomagok mentése
        uses: actions/upload-artifact@v4
        with:
          name: windows-csomagok
          path: dist/*.exe
          if-no-files-found: error
